  <rect x="118" y="55" width="110" height="24" rx="4" fill="#F1F5F9"/>
  <text x="132" y="71" fill="#1E293B" class="font-sans" font-size="11" font-weight="600">+ Nuevo Usuario</text>
  <rect x="236" y="55" width="105" height="24" rx="4" fill="#F1F5F9"/>
  <text x="250" y="71" fill="#1E293B" class="font-sans" font-size="11" font-weight="600">+ Nuevo Grupo</text>
