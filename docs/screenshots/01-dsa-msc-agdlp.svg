  <text x="52" y="310" fill="#334155" class="font-sans" font-size="12">📁 Sistemas</text>
  <text x="52" y="334" fill="#334155" class="font-sans" font-size="12">📁 Marketing  ⚠️</text>
  <text x="36" y="358" fill="#334155" class="font-sans" font-size="12">📁 Servidores</text>

  <line x1="0" y1="378" x2="280" y2="378" stroke="#F1F5F9"/>
  <text x="16" y="398" fill="#94A3B8" class="font-sans" font-size="11" font-weight="700">Administración de Directivas (GPMC)</text>
  <text x="20" y="420" fill="#065F46" class="font-sans" font-size="12" font-weight="600">▾ 🗄️ Objetos de directiva de grupo (5)</text>
  <text x="42" y="442" fill="#475569" class="font-sans" font-size="11">📄 Default Domain Policy</text>
  <text x="42" y="462" fill="#475569" class="font-sans" font-size="11">📄 GPO_Identidad_Corporativa</text>
  <text x="42" y="482" fill="#475569" class="font-sans" font-size="11">📄 GPO_Estaciones_Ventas</text>
  <text x="42" y="502" fill="#475569" class="font-sans" font-size="11">📄 GPO_Seguridad_Critica_CISO</text>

