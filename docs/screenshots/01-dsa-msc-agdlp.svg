  <text x="230" y="28" fill="#FFFFFF" class="font-sans" font-size="12" font-weight="600" text-decoration="underline">Usuarios y Equipos (dsa.msc)</text>
  <text x="415" y="28" fill="#CBD5E1" class="font-sans" font-size="12">GPOs en OU (1)</text>
  <text x="530" y="28" fill="#CBD5E1" class="font-sans" font-size="12">Almacén GPOs (5)</text>
  <text x="655" y="28" fill="#CBD5E1" class="font-sans" font-size="12">RSoP / Simulación</text>
  <text x="780" y="28" fill="#FDE68A" class="font-sans" font-size="12">Retos Guiados (2/3)</text>
  <text x="915" y="28" fill="#CBD5E1" class="font-sans" font-size="12">PowerShell &amp; BPA</text>

