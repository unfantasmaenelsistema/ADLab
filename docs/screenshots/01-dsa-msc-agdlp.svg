  <text x="965" y="312" fill="#0284C7" class="font-sans" font-size="11" font-weight="700">Miembro de (1)</text>
  <line x1="820" y1="322" x2="1180" y2="322" stroke="#E2E8F0"/>

  <text x="838" y="348" fill="#1E293B" class="font-sans" font-size="12" font-weight="700">Pertenencia a Grupos (Paso A → G)</text>
  <rect x="1055" y="332" width="110" height="24" rx="4" fill="#0284C7"/>
  <text x="1066" y="348" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="600">+ Añadir al grupo</text>

  <rect x="838" y="366" width="326" height="36" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="850" y="388" fill="#0369A1" class="font-sans" font-size="12" font-weight="600">GG_Ventas · Global</text>

  <text x="838" y="432" fill="#334155" class="font-sans" font-size="11" font-weight="700">Cadena de Grupos Efectiva (Transitiva AGDLP):</text>
  <text x="838" y="452" fill="#475569" class="font-mono" font-size="10">GG_Ventas [Global] → U_Comercial_Iberia [Universal]</text>
  <text x="838" y="468" fill="#475569" class="font-mono" font-size="10">→ DL_Share_Ventas_RW [DomainLocal]</text>

  <text x="838" y="505" fill="#334155" class="font-sans" font-size="11" font-weight="700">Permisos Efectivos AGDLP:</text>
  <rect x="838" y="516" width="326" height="48" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
