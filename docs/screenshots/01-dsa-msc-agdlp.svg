  <text x="492" y="71" fill="#1E293B" class="font-sans" font-size="11" font-weight="600">Vincular GPO a Ventas</text>

  <!-- Educational AGDLP Error Banner -->
  <rect y="88" width="1200" height="68" fill="#FEF2F2"/>
  <line x1="0" y1="156" x2="1200" y2="156" stroke="#FECACA"/>
  <circle cx="32" cy="116" r="10" fill="#DC2626"/>
  <text x="29" y="120" fill="#FFFFFF" class="font-sans" font-size="12" font-weight="700">!</text>
  <text x="52" y="112" fill="#7F1D1D" class="font-sans" font-size="12" font-weight="700">Error de Arquitectura AD: Domain Local dentro de Global · Código: AD_DL_INTO_GLOBAL</text>
  <text x="52" y="130" fill="#991B1B" class="font-sans" font-size="11">Operación prohibida en Active Directory: Intentas meter el grupo Domain Local "DL_Share_Ventas_RW" dentro del grupo Global "GG_Ventas".</text>
  <text x="52" y="146" fill="#B91C1C" class="font-mono" font-size="11">Flujo recomendado Microsoft: A (Account) → G (Global) → U (Universal) → DL (Domain Local) → P (Permission)</text>

  <!-- 3-Column Workspace -->
  <!-- Left Sidebar TreeView -->
  <rect x="0" y="156" width="280" height="524" fill="#FFFFFF"/>
  <line x1="280" y1="156" x2="280" y2="680" stroke="#E2E8F0"/>
