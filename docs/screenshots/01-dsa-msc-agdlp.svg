  <text x="450" y="338" fill="#64748B" class="font-sans" font-size="11">Usuario · cmartinez</text>
  <text x="610" y="338" fill="#475569" class="font-sans" font-size="11">Habilitado</text>

  <line x1="281" y1="354" x2="801" y2="354" stroke="#F1F5F9"/>
