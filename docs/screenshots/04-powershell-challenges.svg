<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#F8FAFC" rx="8"/>

  <!-- Top Bar -->
  <rect width="1200" height="46" fill="#0F172A"/>
  <text x="24" y="28" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">ADLab MMC Console</text>
  <text x="560" y="28" fill="#FDE68A" class="font-sans" font-size="12" font-weight="700">Retos Guiados (3/3 Superado)</text>
  <text x="760" y="28" fill="#38BDF8" class="font-sans" font-size="12" font-weight="700" text-decoration="underline">PowerShell &amp; BPA</text>

  <!-- Left Column: Guided Challenges -->
  <rect x="24" y="66" width="560" height="550" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="24" y="66" width="560" height="56" rx="6" fill="#FFFBEB"/>
  <text x="44" y="92" fill="#92400E" class="font-mono" font-size="11" font-weight="700">LABORATORIO AUTOCORREGIBLE · EVALUACIÓN EN TIEMPO REAL</text>
  <text x="44" y="110" fill="#0F172A" class="font-sans" font-size="14" font-weight="700">Reto 1: Resolución de Herencia GPO y Despliegue de Software</text>

  <rect x="44" y="140" width="520" height="62" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="64" y="164" fill="#065F46" class="font-sans" font-size="12" font-weight="700">✓ Objetivo 1 Superado</text>
  <text x="64" y="184" fill="#047857" class="font-sans" font-size="11">Ana García recibe el paquete "ERP_Cliente_2026.msi" en su RSoP final.</text>

  <rect x="44" y="214" width="520" height="62" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="64" y="238" fill="#065F46" class="font-sans" font-size="12" font-weight="700">✓ Objetivo 2 Superado</text>
  <text x="64" y="258" fill="#047857" class="font-sans" font-size="11">La directiva "GPO_Seguridad_Critica_CISO" está marcada como Forzada (Enforced).</text>

  <rect x="44" y="288" width="520" height="62" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="64" y="312" fill="#065F46" class="font-sans" font-size="12" font-weight="700">✓ Objetivo 3 Superado</text>
  <text x="64" y="332" fill="#047857" class="font-sans" font-size="11">Ana García conserva el tapiz comercial "bg_comercial.jpg" de la OU Ventas.</text>

  <text x="44" y="384" fill="#0F172A" class="font-sans" font-size="13" font-weight="700">Analizador de Buenas Prácticas (Active Directory BPA)</text>
  <rect x="44" y="398" width="520" height="68" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="60" y="420" fill="#1E293B" class="font-sans" font-size="11" font-weight="700">GPO en almacén pendiente de vincular: "GPO_WindowsUpdate_Diferido"</text>
  <text x="60" y="440" fill="#64748B" class="font-sans" font-size="11">Recomendación: Vincúlala a una OU de prueba o elimínala si está en desuso.</text>

  <!-- Right Column: PowerShell Deployment Script -->
  <rect x="604" y="66" width="572" height="550" rx="6" fill="#0F172A"/>
  <text x="628" y="96" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">Windows PowerShell · deploy-adlab.ps1</text>
  <rect x="1010" y="76" width="144" height="28" rx="4" fill="#4F46E5"/>
  <text x="1024" y="94" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="600">⬇ Descargar .ps1</text>

  <text x="628" y="134" fill="#94A3B8" class="font-mono" font-size="11"># 1. CREACIÓN DE UNIDADES ORGANIZATIVAS Y HERENCIA</text>
  <text x="628" y="156" fill="#E2E8F0" class="font-mono" font-size="11">Import-Module ActiveDirectory; Import-Module GroupPolicy</text>
  <text x="628" y="180" fill="#7DD3FC" class="font-mono" font-size="11">New-ADOrganizationalUnit -Name "Corporativo" `</text>
  <text x="644" y="198" fill="#7DD3FC" class="font-mono" font-size="11">-Path "DC=adlab,DC=local" -ProtectedFromAccidentalDeletion $true</text>
  <text x="628" y="222" fill="#7DD3FC" class="font-mono" font-size="11">New-ADOrganizationalUnit -Name "Ventas" `</text>
  <text x="644" y="240" fill="#7DD3FC" class="font-mono" font-size="11">-Path "OU=Corporativo,DC=adlab,DC=local"</text>

  <text x="628" y="274" fill="#94A3B8" class="font-mono" font-size="11"># 2. MODELO AGDLP (CUENTAS Y ANIDAMIENTO DE GRUPOS)</text>
  <text x="628" y="296" fill="#6EE7B7" class="font-mono" font-size="11">New-ADGroup -Name "GG_Ventas" -GroupScope Global</text>
  <text x="628" y="318" fill="#6EE7B7" class="font-mono" font-size="11">New-ADGroup -Name "U_Comercial_Iberia" -GroupScope Universal</text>
  <text x="628" y="340" fill="#6EE7B7" class="font-mono" font-size="11">New-ADGroup -Name "DL_Share_Ventas_RW" -GroupScope DomainLocal</text>
  <text x="628" y="362" fill="#E2E8F0" class="font-mono" font-size="11">Add-ADGroupMember -Identity "GG_Ventas" -Members "agarcia"</text>
  <text x="628" y="384" fill="#E2E8F0" class="font-mono" font-size="11">Add-ADGroupMember -Identity "U_Comercial_Iberia" -Members "GG_Ventas"</text>
  <text x="628" y="406" fill="#E2E8F0" class="font-mono" font-size="11">Add-ADGroupMember -Identity "DL_Share_Ventas_RW" -Members "U_Comercial_Iberia"</text>

  <text x="628" y="440" fill="#94A3B8" class="font-mono" font-size="11"># 3. VINCULACIÓN DE DIRECTIVAS GPO Y FORZADO (ENFORCED)</text>
  <text x="628" y="462" fill="#FDE68A" class="font-mono" font-size="11">New-GPLink -Name "GPO_Seguridad_Critica_CISO" `</text>
  <text x="644" y="480" fill="#FDE68A" class="font-mono" font-size="11">-Target "DC=adlab,DC=local" -Enforced Yes -Order 1</text>
  <text x="628" y="504" fill="#FDE68A" class="font-mono" font-size="11">New-GPLink -Name "GPO_Estaciones_Ventas" `</text>
  <text x="644" y="522" fill="#FDE68A" class="font-mono" font-size="11">-Target "OU=Ventas,OU=Corporativo,DC=adlab,DC=local" -Order 1</text>
</svg>
