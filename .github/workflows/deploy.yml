name: Desplegar ADLab en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # AI Studio trabaja con Bun y solo hay bun.lock (con npm y caché de npm el despliegue fallaba)
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Comprobar tipos
        run: bun run lint

      - name: Compilar para GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto estático (dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
